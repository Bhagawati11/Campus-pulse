---
- name: Provision Campus Pulse app server
  hosts: app_server
  become: true

  vars:
    project_dir: /home/ubuntu/campus-pulse

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes
    
    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Clone Campus Pulse repository
      git:
        repo: https://github.com/Bhagawati11/Campus-pulse.git
        dest: "{{ project_dir }}"
        version: main
        force: yes
      # Alternative if 'synchronize' (needs rsync) isn't available:
      # use 'git clone' of your GitHub repo here instead, e.g.:
      # - name: Clone repo
      #   git:
      #     repo: https://github.com/<you>/campus-pulse.git
      #     dest: "{{ project_dir }}"

    - name: Copy .env with RDS endpoint (edit before running)
      copy:
        dest: "{{ project_dir }}/.env"
        content: |
          DB_HOST={{ rds_endpoint }}
          DB_PORT=5432
          DB_NAME=campus_pulse
          DB_USER=postgres
          DB_PASSWORD={{ db_password }}
        owner: ubuntu
        group: ubuntu
      when: rds_endpoint is defined

    - name: Run docker compose up
      command: docker compose up -d --build
      args:
        chdir: "{{ project_dir }}"
