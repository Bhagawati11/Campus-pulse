<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Pulse — Locations</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <nav class="topnav">
    <div class="brand">Campus Pulse</div>
    <div class="nav-links">
      <a href="index.html" data-nav-link="index.html">Dashboard</a>
      <a href="locations.html" data-nav-link="locations.html">Locations</a>
      <a href="rooms.html" data-nav-link="rooms.html">Study Spaces</a>
      <a href="events.html" data-nav-link="events.html">Events</a>
      <a href="admin.html" data-nav-link="admin.html">Admin</a>
    </div>
  </nav>

  <header class="page-header">
    <h1>Locations</h1>
    <p>Check in or out, and see live crowd levels update instantly for everyone.</p>
  </header>

  <main>
    <section class="panel">
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search locations..." />
        <div class="filter-chips" id="filterChips">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="low">Low</button>
          <button class="chip" data-filter="moderate">Moderate</button>
          <button class="chip" data-filter="high">High</button>
          <button class="chip" data-filter="full">Full</button>
        </div>
      </div>
      <div id="locationCards" class="cards location-cards"></div>
      <p id="emptyState" class="empty-state" hidden>No locations match your filters.</p>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="locations.js"></script>
</body>
</html>
